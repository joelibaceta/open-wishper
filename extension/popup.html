<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: 'Google Sans', Roboto, Arial, sans-serif;
        width: 360px;
        margin: 0;
        padding: 12px;
        color: #202124;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      label {
        font-size: 12px;
        color: #5f6368;
        display: block;
        margin-bottom: 4px;
      }
      input[type='url'] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font-size: 12px;
        border: 1px solid #dadce0;
        border-radius: 6px;
      }
      button {
        margin-top: 8px;
        padding: 6px 12px;
        font-size: 12px;
        border: 0;
        border-radius: 6px;
        background: #1a73e8;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: #f1f3f4;
        color: #202124;
      }
      .status {
        font-size: 11px;
        color: #188038;
        margin-left: 8px;
      }
      hr {
        border: 0;
        border-top: 1px solid #eee;
        margin: 12px 0;
      }
      .msg {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid #f1f3f4;
        font-size: 12px;
      }
      .msg .subj {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .msg .to {
        color: #5f6368;
        font-size: 11px;
      }
      .pill {
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 10px;
        white-space: nowrap;
      }
      .pill.opened {
        background: #e6f4ea;
        color: #188038;
      }
      .pill.sent {
        background: #f1f3f4;
        color: #5f6368;
      }
      .empty {
        color: #9aa0a6;
        font-size: 12px;
        padding: 8px 0;
      }
    </style>
  </head>
  <body>
    <h1>📧 Pixel Tracker</h1>

    <label for="backend">URL del backend (Cloudflare Worker)</label>
    <input id="backend" type="url" placeholder="https://px.groway.studio" />
    <div>
      <button id="save">Guardar</button>
      <button id="refresh" class="secondary">Actualizar estado</button>
      <span id="saved" class="status"></span>
    </div>

    <hr />
    <div id="list"></div>

    <script src="popup.js"></script>
  </body>
</html>
