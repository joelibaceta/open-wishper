name = "pixel-tracker"
main = "src/index.js"
compatibility_date = "2024-11-01"
account_id = "e928800c53f0c443ea5a9a7c55c0c2f2"

# Dominio propio para el pixel (Cloudflare crea el registro DNS automáticamente).
# Para reutilizar con otro dominio: cambia este pattern por tu subdominio.
[[routes]]
pattern = "px.groway.studio"
custom_domain = true

# KV namespace para guardar los mensajes y sus aperturas.
# Crea el namespace con:
#   npx wrangler kv namespace create TRACKER
# y pega el id que te devuelve aquí abajo.
[[kv_namespaces]]
binding = "TRACKER"
id = "b0ffd1d7404f4f47a0c4a6a9f22f0d5e"
